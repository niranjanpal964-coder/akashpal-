<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next-Level AI Business Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:radial-gradient(circle at top left,#312e81,#0f172a 55%,#020617);
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      color:#fff;
      overflow:hidden;
    }
    canvas#bgAnimation{
      position:fixed;
      inset:0;
      z-index:0;
    }
    .chatbot-container{
      width:460px;
      max-width:96%;
      height:820px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(28px);
      border:1px solid rgba(255,255,255,0.14);
      border-radius:30px;
      overflow:hidden;
      box-shadow:0 30px 100px rgba(0,0,0,0.55);
      display:flex;
      flex-direction:column;
      position:relative;
      z-index:2;
    }
    .chat-header{
      padding:20px 24px;
      background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .header-left{display:flex;align-items:center;gap:14px}
    .bot-avatar{
      width:58px;height:58px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      background:#fff;color:#4f46e5;
      font-size:1.7rem;font-weight:700;
      box-shadow:0 0 25px rgba(255,255,255,.35);
    }
    .chat-header h2{
      font-family:'Orbitron',sans-serif;
      font-size:1rem;
      letter-spacing:1px;
    }
    .status{font-size:.78rem;opacity:.9}
    .live-dot{
      display:inline-block;width:8px;height:8px;
      background:#22c55e;border-radius:50%;margin-right:6px;
      box-shadow:0 0 12px #22c55e;
    }
    .theme-toggle{
      cursor:pointer;
      padding:8px 12px;
      border-radius:12px;
      background:rgba(255,255,255,.15);
      font-size:.8rem;
    }
    .chat-box{
      flex:1;
      padding:20px;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .message{
      max-width:84%;
      padding:15px 18px;
      border-radius:20px;
      line-height:1.6;
      font-size:.94rem;
      animation:fadeIn .35s ease;
    }
    .bot-message{
      align-self:flex-start;
      background:rgba(124,58,237,.18);
      border:1px solid rgba(124,58,237,.25);
    }
    .user-message{
      align-self:flex-end;
      background:rgba(6,182,212,.18);
      border:1px solid rgba(6,182,212,.25);
    }
    .typing{
      display:none;
      align-self:flex-start;
      padding:12px 16px;
      background:rgba(255,255,255,.08);
      border-radius:18px;
    }
    .typing span{
      display:inline-block;width:8px;height:8px;margin:0 2px;
      background:#fff;border-radius:50%;animation:bounce 1.2s infinite;
    }
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    .quick-actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      padding:0 18px 16px;
    }
    .quick-btn{
      border:none;
      padding:9px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.08);
      color:#fff;
      cursor:pointer;
      font-size:.78rem;
      transition:.3s;
    }
    .quick-btn:hover{background:#7c3aed;transform:translateY(-2px)}
    .chat-input-area{
      padding:18px;
      border-top:1px solid rgba(255,255,255,.08);
      display:flex;
      gap:10px;
      background:rgba(0,0,0,.18);
    }
    .chat-input{
      flex:1;
      padding:15px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,.08);
      color:#fff;
    }
    .send-btn{
      padding:15px 20px;
      border:none;
      border-radius:16px;
      background:linear-gradient(90deg,#7c3aed,#06b6d4);
      color:#fff;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
    }
    .send-btn:hover{transform:scale(1.05)}
    .chat-footer{
      padding:10px;
      text-align:center;
      font-size:.72rem;
      color:rgba(255,255,255,.55);
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    @media(max-width:500px){
      .chatbot-container{width:100%;height:100vh;border-radius:0}
    }
  </style>
</head>
<body>
<canvas id="bgAnimation"></canvas>
<div class="chatbot-container">
  <div class="chat-header">
    <div class="header-left">
      <div class="bot-avatar">AI</div>
      <div>
        <h2>AKASH PAL AI</h2>
        <p class="status"><span class="live-dot"></span>Online • Elite Support System</p>
      </div>
    </div>
    <div class="theme-toggle" onclick="toggleTheme()">Theme</div>
  </div>  <div class="chat-box" id="chatBox">
    <div class="message bot-message">
      🚀 Welcome to Akash pal AI Assistant.<br>
      Advanced support for Web Development, SEO, Branding, Automation, and Digital Growth.
    </div>
    <div class="typing" id="typing"><span></span><span></span><span></span></div>
  </div>  <div class="quick-actions">
    <button class="quick-btn" onclick="quickReply('Website Price')">Pricing</button>
    <button class="quick-btn" onclick="quickReply('Portfolio')">Portfolio</button>
    <button class="quick-btn" onclick="quickReply('SEO Services')">SEO</button>
    <button class="quick-btn" onclick="quickReply('Branding')">Branding</button>
    <button class="quick-btn" onclick="quickReply('Automation')">Automation</button>
    <button class="quick-btn" onclick="quickReply('Contact')">Contact</button>
  </div>  <div class="chat-input-area">
    <input type="text" id="userInput" class="chat-input" placeholder="Ask anything about your business...">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>  <div class="chat-footer">Powered by Akash Pal Digital Systems</div>
</div><script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const typing = document.getElementById('typing');
let darkMode = true;

function addMessage(message, sender) {
  const msg = document.createElement('div');
  msg.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
  msg.innerHTML = message;
  chatBox.insertBefore(msg, typing);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping(){typing.style.display='block';chatBox.scrollTop=chatBox.scrollHeight;}
function hideTyping(){typing.style.display='none';}

function botReply(input){
  input = input.toLowerCase();

  if(input.includes('price')||input.includes('website')){
    return '💼 Premium Services:<br>• Business Website: ₹5,000+<br>• Portfolio: ₹4,000+<br>• E-commerce: ₹15,000+<br>• AI Automation Systems Available';
  } else if(input.includes('portfolio')){
    return '🌐 Premium Portfolio with futuristic UI, animations, SEO, branding, and conversion optimization.';
  } else if(input.includes('seo')){
    return '🚀 SEO Growth:<br>• Ranking Boost<br>• Site Speed<br>• Google Visibility<br>• Business Leads';
  } else if(input.includes('branding')){
    return '🎨 Branding:<br>• Logo Design<br>• Identity Systems<br>• Landing Pages<br>• Premium Presence';
  } else if(input.includes('automation')){
    return '🤖 Automation:<br>• Chatbots<br>• Lead Systems<br>• Customer Support Bots<br>• Workflow Automation';
  } else if(input.includes('contact')){
    return '📞 WhatsApp: +91 7363872892<br>📧 Email: niranjanp117@gmail.com';
  } else {
    return '🤖 Akash pal AI can help with digital growth, automation, premium websites, and branding solutions.';
  }
}

function processMessage(text){
  showTyping();
  setTimeout(()=>{
    hideTyping();
    addMessage(botReply(text),'bot');
  },900);
}

function sendMessage(){
  const text = userInput.value.trim();
  if(!text) return;
  addMessage(text,'user');
  userInput.value='';
  processMessage(text);
}

function quickReply(text){
  addMessage(text,'user');
  processMessage(text);
}

userInput.addEventListener('keypress',e=>{
  if(e.key==='Enter') sendMessage();
});

function toggleTheme(){
  darkMode=!darkMode;
  document.body.style.background = darkMode
    ? 'radial-gradient(circle at top left,#312e81,#0f172a 55%,#020617)'
    : 'linear-gradient(135deg,#60a5fa,#c084fc,#f8fafc)';
}

// Animated Particle Background
const canvas = document.getElementById('bgAnimation');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];

for(let i=0;i<80;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+1,
    dx:(Math.random()-.5)*0.7,
    dy:(Math.random()-.5)*0.7
  });
}

function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='rgba(255,255,255,0.5)';
  particles.forEach(p=>{
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
});
</script></body>
</html>
