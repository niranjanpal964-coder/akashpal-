<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced AI Business Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Poppins',sans-serif;
      background:radial-gradient(circle at top left,#1d4ed8,#0f172a 55%,#020617);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      overflow:hidden;
    }
    body::before, body::after{
      content:'';
      position:absolute;
      border-radius:50%;
      filter:blur(100px);
      opacity:.25;
    }
    body::before{width:260px;height:260px;background:#7c3aed;top:5%;left:10%}
    body::after{width:300px;height:300px;background:#06b6d4;bottom:8%;right:10%}
    .chatbot-container{
      width:420px;
      max-width:96%;
      height:760px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(24px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 25px 80px rgba(0,0,0,0.45);
      display:flex;
      flex-direction:column;
      position:relative;
      z-index:2;
    }
    .chat-header{
      padding:22px;
      background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .header-left{display:flex;align-items:center;gap:14px}
    .bot-avatar{
      width:54px;height:54px;border-radius:50%;
      background:#fff;color:#4f46e5;
      display:flex;align-items:center;justify-content:center;
      font-size:1.6rem;font-weight:700;
      box-shadow:0 0 20px rgba(255,255,255,0.35);
    }
    .status{font-size:.82rem;opacity:.9}
    .live-dot{
      display:inline-block;width:8px;height:8px;
      background:#22c55e;border-radius:50%;margin-right:6px;
      box-shadow:0 0 10px #22c55e;
    }
    .chat-box{
      flex:1;padding:20px;overflow-y:auto;
      display:flex;flex-direction:column;gap:14px;
      scroll-behavior:smooth;
    }
    .chat-box::-webkit-scrollbar{width:4px}
    .chat-box::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:10px}
    .message{
      max-width:82%;padding:14px 18px;border-radius:20px;
      line-height:1.6;font-size:.95rem;
      animation:fadeIn .35s ease;
    }
    .bot-message{
      background:rgba(124,58,237,0.18);
      border:1px solid rgba(124,58,237,0.28);
      align-self:flex-start;
    }
    .user-message{
      background:rgba(6,182,212,0.18);
      border:1px solid rgba(6,182,212,0.28);
      align-self:flex-end;
    }
    .typing{
      display:none;
      align-self:flex-start;
      padding:12px 16px;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
    }
    .typing span{
      display:inline-block;width:8px;height:8px;margin:0 2px;
      background:#fff;border-radius:50%;animation:bounce 1.2s infinite;
    }
    .typing span:nth-child(2){animation-delay:.2s}
    .typing span:nth-child(3){animation-delay:.4s}
    .quick-actions{
      display:flex;flex-wrap:wrap;gap:8px;
      padding:0 18px 16px;
    }
    .quick-btn{
      padding:9px 14px;border:none;border-radius:999px;
      background:rgba(255,255,255,0.08);
      color:#fff;cursor:pointer;font-size:.78rem;
      transition:.3s;
    }
    .quick-btn:hover{background:#7c3aed;transform:translateY(-2px)}
    .chat-input-area{
      padding:18px;
      border-top:1px solid rgba(255,255,255,0.08);
      display:flex;gap:10px;
      background:rgba(0,0,0,0.18);
    }
    .chat-input{
      flex:1;padding:14px 16px;border:none;outline:none;
      border-radius:16px;background:rgba(255,255,255,0.08);
      color:#fff;font-size:.95rem;
    }
    .chat-input::placeholder{color:rgba(255,255,255,.55)}
    .send-btn{
      padding:14px 20px;border:none;border-radius:16px;
      background:linear-gradient(90deg,#7c3aed,#06b6d4);
      color:#fff;cursor:pointer;font-weight:600;
      transition:.3s;
    }
    .send-btn:hover{transform:scale(1.05)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
    @media(max-width:500px){
      .chatbot-container{height:100vh;width:100%;border-radius:0}
    }
  </style>
</head>
<body>
<div class="chatbot-container">
  <div class="chat-header">
    <div class="header-left">
      <div class="bot-avatar">AI</div>
      <div>
        <h2>Akash AI Assistant</h2>
        <p class="status"><span class="live-dot"></span>Online • Smart Business Support</p>
      </div>
    </div>
  </div>  <div class="chat-box" id="chatBox">
    <div class="message bot-message">
      👋 Welcome to Akash Pal Digital Studio!<br>
      I can help with websites, SEO, pricing, portfolio, branding, and business growth.
    </div>
    <div class="typing" id="typing">
      <span></span><span></span><span></span>
    </div>
  </div>  <div class="quick-actions">
    <button class="quick-btn" onclick="quickReply('Website Price')">Website Price</button>
    <button class="quick-btn" onclick="quickReply('Portfolio')">Portfolio</button>
    <button class="quick-btn" onclick="quickReply('SEO Services')">SEO</button>
    <button class="quick-btn" onclick="quickReply('Branding')">Branding</button>
    <button class="quick-btn" onclick="quickReply('Contact')">Contact</button>
  </div>  <div class="chat-input-area">
    <input type="text" id="userInput" class="chat-input" placeholder="Ask about services, SEO, pricing...">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div><script>
const chatBox = document.getElementById('chatBox');
const userInput = document.getElementById('userInput');
const typing = document.getElementById('typing');

function addMessage(message, sender) {
  const msg = document.createElement('div');
  msg.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
  msg.innerHTML = message;
  chatBox.insertBefore(msg, typing);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  typing.style.display = 'block';
  chatBox.scrollTop = chatBox.scrollHeight;
}

function hideTyping() {
  typing.style.display = 'none';
}

function botReply(input) {
  input = input.toLowerCase();

  if (input.includes('price') || input.includes('website')) {
    return '💼 Website Pricing:<br>• Business Site: ₹5,000+<br>• Portfolio: ₹4,000+<br>• E-commerce: ₹15,000+<br>• Custom Premium Solutions Available';
  } else if (input.includes('portfolio')) {
    return '🌐 Portfolio includes premium UI/UX, animations, SEO optimization, and conversion-focused design.';
  } else if (input.includes('seo')) {
    return '🚀 SEO Services:<br>• Speed Optimization<br>• Google Ranking<br>• Keyword Strategy<br>• Lead Generation';
  } else if (input.includes('branding')) {
    return '🎨 Branding Solutions:<br>• Logo Design<br>• Business Identity<br>• Landing Pages<br>• Premium Online Presence';
  } else if (input.includes('contact')) {
    return '📞 WhatsApp: +91 7363872892<br>📧 Email: niranjanp117@gmail.com';
  } else if (input.includes('hello') || input.includes('hi')) {
    return '👋 Hello! Ready to build your online business presence?';
  } else {
    return '🤖 I can help with website development, SEO, branding, and digital growth. Contact directly for custom projects.';
  }
}

function processMessage(text) {
  showTyping();
  setTimeout(() => {
    hideTyping();
    addMessage(botReply(text), 'bot');
  }, 900);
}

function sendMessage() {
  const text = userInput.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  userInput.value = '';
  processMessage(text);
}

function quickReply(text) {
  addMessage(text, 'user');
  processMessage(text);
}

userInput.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});
</script></body>
</html>
