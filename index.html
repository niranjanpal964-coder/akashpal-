<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akash Pal AI | Business Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #10b981;
      --bg: #030712;
      --glass: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: #fff; line-height: 1.6; overflow-x: hidden; }

    nav { padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.4rem; font-weight: 800; color: var(--primary); }

    .hero { padding: 80px 10%; text-align: center; }
    .hero h1 { font-size: 3rem; font-weight: 800; margin-bottom: 20px; }
    .highlight { background: linear-gradient(90deg, #6366f1, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 30px; }

    .pricing { padding: 40px 10% 100px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
    .p-card { 
      background: var(--glass); 
      padding: 40px; 
      border-radius: 24px; 
      border: 1px solid var(--border); 
      text-align: center;
      transition: transform 0.3s ease;
    }
    .p-card:hover { transform: translateY(-10px); border-color: var(--primary); }
    .price { font-size: 2.5rem; font-weight: 800; margin: 20px 0; }
    
    .btn {
      background: var(--primary);
      color: white;
      padding: 12px 25px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    @media (max-width: 600px) {
      .hero h1 { font-size: 2.2rem; }
      .pricing { padding: 20px 5% 100px; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">AKASH PAL AI</div>
    <a href="index.html" style="color:#fff;text-decoration:none;">Try Chatbot →</a>
  </nav>

  <section class="hero">
    <h1>Grow Your Business with <span class="highlight">Smart AI Chatbots</span></h1>
    <p>আপনার কাস্টমারদের সাথে ২৪/৭ যোগাযোগ রাখুন অটোমেটেড এআই চ্যাটবটের মাধ্যমে।</p>
    <a href="index.html" class="btn" style="width: auto; padding: 15px 40px;">Try Live Chatbot</a>
  </section>

  <section class="pricing">
    <div class="p-card">
      <h3 style="color: var(--secondary)">Basic Bot</h3>
      <p style="margin-top:10px; color:#94a3b8;">Rule-based basic interactions.</p>
      <div class="price">₹1,499</div>
      <button class="btn">Choose Plan</button>
    </div>

    <div class="p-card" style="border-color: var(--primary);">
      <h3 style="color: var(--primary)">Pro AI Bot</h3>
      <p style="margin-top:10px; color:#94a3b8;">Advanced NLP & Lead Generation.</p>
      <div class="price">₹4,999</div>
      <button class="btn">Choose Plan</button>
    </div>
  </section>

  <script src="//code.tidio.co/aw50nk46v1ffhtvdunskihbjtlhh1zc.js" async></script>

</body>
</html>
