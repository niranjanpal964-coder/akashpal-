<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Akash Pal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #f5f5f5; 
      padding: 20px; 
    }
    .header { 
      background: white; 
      padding: 20px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg-card { 
      background: white; 
      padding: 20px; 
      margin: 15px 0; 
      border-radius: 12px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    .msg-card h3 { color: #667eea; margin-bottom: 8px; }
    .msg-card p { color: #666; margin: 5px 0; }
    .msg-card .time { font-size: 12px; color: #999; margin-top: 10px; }
    button { 
      padding: 10px 20px; 
      background: #ff4757; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #e84118; }
    .loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📬 Client Messages</h1>
    <button onclick="logout()">Logout</button>
  </div>
  <div id="messages" class="loading">Loading messages...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDBL1a98VIf9KxdmdhOIsIHjiuMNx9G--Y",
      authDomain: "akashpal-d63d9.firebaseapp.com",
      projectId: "akashpal-d63d9",
      storageBucket: "akashpal-d63d9.firebasestorage.app",
      messagingSenderId: "844251425292",
      appId: "1:844251425292:web:5395bd1d62a7444f665c29"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = 'login.html';
      } else {
        loadMessages();
      }
    });

    async function loadMessages() {
      const q = query(collection(db, "messages"), orderBy("time", "desc"));
      const querySnapshot = await getDocs(q);
      const messagesDiv = document.getElementById('messages');
      
      if (querySnapshot.empty) {
        messagesDiv.innerHTML = '<p style="text-align:center;color:#999;">No messages yet</p>';
        return;
      }
      
      messagesDiv.innerHTML = '';
      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const date = data.time ? data.time.toDate().toLocaleString() : 'Just now';
        messagesDiv.innerHTML += `
          <div class="msg-card">
            <h3>${data.name}</h3>
            <p>📧 ${data.email}</p>
            <p>💬 ${data.message}</p>
            <p class="time">⏰ ${date}</p>
          </div>
        `;
      });
    }

    window.logout = async () => {
      await signOut(auth);
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
